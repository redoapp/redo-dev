        - SOLID_PINK
        - SOLID_RED
        - SOLID_ORANGE
        - SOLID_YELLOW
        - SOLID_GREEN
        - SOLID_LIGHT_BLUE
        - SOLID_NAVY
        - SOLID_BLACK
        - BRAND
        - GRAY_BLUE
        - WHITE_SUCCESS
        - GRAY_ALTERNATE
        - BRAND_ALTERNATE
        - ERROR_ALTERNATE
        - WARNING_ALTERNATE
        - SUCCESS_ALTERNATE
        - GRAY_BLUE_ALTERNATE
        - BLUE_LIGHT_ALTERNATE
        - BLUE_ALTERNATE
        - INDIGO_ALTERNATE
        - PURPLE_ALTERNATE
        - PINK_ALTERNATE
        - ORANGE_ALTERNATE
        - BLACK_ALTERNATE
        - WHITE_ALTERNATE
        - WHITE_SUCCESS_ALTERNATE
      title: Pill theme
