# $schema: https://json-schema.org/draft/2020-12/schema#
description: Shipment information.
properties:
  documents:
    description: Available shipping documents. You can access these documents using the GET Shipment document endpoint.
    items:
      $ref: ./shipment-document.schema.yaml
    title: Documents
    type: array
  id:
    description: Shipment identifier
    title: Shipment ID
    type: string
  price:
    $ref: ./money.schema.yaml
  tracker:
    $ref: ./shipment-tracker.schema.yaml
required:
  - id
  - documents
  - tracker
  - price
title: Shipment
type: object
