# $schema: https://json-schema.org/draft/2020-12/schema#
additionalProperties: false
description: Request body for creating or updating a customer profile. The email address is used as the upsert key.
properties:
  email:
    description: Customer email address. Used as the upsert key to find or create the customer.
    format: email
    type: string
  firstName:
    description: Customer first name
    type: string
  lastName:
    description: Customer last name
    type: string
  phoneNumber:
    description: Customer phone number in E.164 format (e.g., +12345678900). Appended to the existing phone list if not already present.
    examples: ["+12345678900"]
    type: string
  location:
    $ref: ./customer-location.schema.yaml
  customFields:
    description: >-
      Custom field values as key-value pairs. Keys are field names and values
      can be strings, numbers, or booleans. The field type is determined
      automatically based on the value:

      - String values → STRING custom field

      - Number values → NUMBER custom field

      - Boolean values → BOOLEAN custom field

      - ISO 8601 datetime strings (e.g., "2026-02-24T12:15:00.000Z") → DATE
      custom field (auto-detected)


      If a field name does not already have a declaration, one is created
      automatically. For STRING fields, unique values are tracked as options
      (used for segment filtering dropdowns). NUMBER, BOOLEAN, and DATE fields
      do not track options.
    type: object
    additionalProperties:
      oneOf:
        - type: string
        - type: number
        - type: boolean
    example:
      subscription_source: "web"
      status: "Active"
      loyalty_points: 1250
      vip_member: true
      signup_date: "2026-02-24T12:15:00.000Z"
required:
  - email
title: Customer Upsert Request
type: object
