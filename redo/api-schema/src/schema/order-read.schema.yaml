# $schema: https://json-schema.org/draft/2020-12/schema#
description: Order.
properties:
  customer:
    properties:
      emailAddress:
        description: Email address of customer.
        format: email
        title: Email address
        type: string
      name:
        $ref: ./person-name.schema.yaml
        description: Name of customer.
        title: Name
      phoneNumber:
        $ref: ./phone-number.schema.yaml
        description: Phone number of customer.
        title: Phone number
    required: [name]
    type: object
  discounts:
    $ref: ./money.schema.yaml
    description:
      The total amount discounted on the order before returns. This includes
      both order and line level discounts.
    title: Discounts
  externalId:
    description: Shopify ID
    examples: ["1073459971", "450789469"]
    title: External ID
    type: string
  id:
    description: Order ID
    example: 64e4da943dd822979a70bd12
    title: ID
    type: string
  items:
    items:
      properties:
        externalId:
          example: "123"
          type: string
        fulfillmentLocationId:
          description: ID of the location where the item was be fulfilled.
          example: "123"
          type: [string, "null"]
        id:
          description: Line item ID
          title: ID
          type: string
        price:
          $ref: ./money.schema.yaml
          title: Price
        product:
          $ref: ./product.schema.yaml
          title: Product
        quantity:
          $ref: ./item-quantity.schema.yaml
          title: Quantity
        variant:
          $ref: ./product-variant.schema.yaml
          title: Variant
      required: [id, product, quantity, variant, price, fulfillmentLocationId]
    title: Line items
    type: array
  lineItemsTotal:
    $ref: ./money.schema.yaml
    description:
      Total price of all line items before discounts, shipping, and taxes.
    title: Line Items Total
  name:
    description: Shopify name.
    examples: ["#123"]
    title: Name
    type: string
  shippingCost:
    $ref: ./money.schema.yaml
    description:
      The total shipping cost for the order. This includes fees and any related
      discounts that were refunded.
    title: Shipping Cost
  taxes:
    $ref: ./money.schema.yaml
    description: Total taxes applied to the order.
    title: Taxes
  total:
    $ref: ./money.schema.yaml
    description:
      The total price of the order, before returns. This includes taxes,
      discounts, and shipping costs.
    title: Total
required:
  [
    customer,
    id,
    items,
    name,
    discounts,
    lineItemsTotal,
    shippingCost,
    total,
    taxes,
  ]
title: Order
type: object
