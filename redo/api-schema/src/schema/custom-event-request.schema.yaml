# $schema: https://json-schema.org/draft/2020-12/schema#
additionalProperties: true
description: >
  Custom event to trigger flows with merchant-defined event names and properties.
properties:
  eventName:
    description: The name of the custom event (e.g., 'User Registered', 'Loyalty Reward Earned').
    type: string
  customer:
    description: >
      Customer identity and profile fields. At least one of `id`, `email`, or
      `phoneNumber` is required for identity resolution.
    type: object
    additionalProperties: false
    anyOf:
      - required: [id]
      - required: [email]
      - required: [phoneNumber]
    properties:
      id:
        description: Redo customer ObjectId. Used for identity resolution. Takes priority over email and phoneNumber when provided.
        type: string
      email:
        description: Customer email address. Used for identity resolution.
        format: email
        type: string
      phoneNumber:
        description: Customer phone number in E.164 format. Used for identity resolution.
        type: string
      firstName:
        description: Customer first name. Applied with patch semantics — does not erase existing value if omitted.
        type: string
      lastName:
        description: Customer last name. Applied with patch semantics — does not erase existing value if omitted.
        type: string
      location:
        description: Customer location for profile enrichment. All fields are optional.
        type: object
        additionalProperties: false
        properties:
          street1:
            description: Primary street address.
            type: string
          street2:
            description: Secondary address line (apartment, suite, etc.).
            type: string
          city:
            description: City name.
            type: string
          state:
            description: State or province name.
            type: string
          stateCode:
            description: State or province abbreviation (e.g., "CA", "NY").
            type: string
          postalCode:
            description: Postal or ZIP code.
            type: string
          country:
            description: Country name.
            type: string
          countryCode:
            description: ISO 3166-1 alpha-2 country code (e.g., "US", "GB").
            type: string
          ianaTimeZoneName:
            description: IANA time zone identifier (e.g., "America/New_York").
            type: string
          latitude:
            description: Geographic latitude coordinate.
            type: number
          longitude:
            description: Geographic longitude coordinate.
            type: number
      customFields:
        description: >
          Merchant-defined customer attributes as key-value pairs. Values can be
          strings, numbers, or booleans. Date values should be passed as ISO 8601
          strings (e.g., "2026-04-02T12:00:00Z") and are automatically detected
          and indexed as dates.
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: number
            - type: boolean
  data:
    description: >
      Custom properties for this event (must not exceed 400 properties). The
      size of the event payload must not exceed 5 MB, and each string cannot be
      larger than 100 KB. For a full list of data limits on event payloads, see
      [Limitations](/docs/guides/integrations/custom-events#rate-limits).


      Note any top-level property that is not an object can be used to create
      segments. The `$extra` property records any non-segmentable values that
      can be referenced later, e.g., HTML templates are useful on a segment but
      are not used to create a segment.
    type: object
    additionalProperties:
      description: >
        Segmentable event property. Each key you add becomes available for
        audience segmentation and automation conditions. Supported types are
        string, number, boolean, and date (ISO 8601 strings like
        "2025-01-15T00:00:00Z" are auto-detected as dates). Values of 0, null,
        and empty string ("") are treated as unset and will not be stored.
      anyOf:
        - type: string
        - type: number
        - type: boolean
    properties:
      $extra:
        description: >
          Non-segmentable metadata bucket. Values inside `$extra` are stored on
          the event but excluded from segmentation indexes. Unlike top-level
          data properties, values of 0, null, and empty string are NOT stripped
          inside `$extra`. Use this for large text, debug info, nested objects,
          arrays, or any data you want to reference in templates but not segment
          on.
        type: object
        additionalProperties: true
  eventTimestamp:
    description: ISO 8601 timestamp when the event occurred. Defaults to current time if not provided.
    format: date-time
    type: string
  value:
    description: Monetary or conversion value associated with the event (e.g., purchase amount).
    type: number
  valueCurrency:
    description: ISO 4217 currency code for the value field (e.g., "USD", "EUR").
    type: string
  uniqueId:
    description: >
      Merchant-controlled deduplication key (1-255 characters). If provided,
      subsequent events with the same uniqueId for the same store are silently
      deduplicated. Use this for safe retries and at-least-once delivery patterns.
    type: string
required:
  - eventName
  - customer
title: Custom Event Request
type: object
