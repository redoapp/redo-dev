# $schema: https://json-schema.org/draft/2020-12/schema#
additionalProperties: true
description: >
  Custom event to trigger flows with merchant-defined event names and properties.
properties:
  eventName:
    description: The name of the custom event (e.g., 'user_registered', 'purchase_completed').
    type: string
  customer:
    description: Customer identity and profile fields. At least one of id, email, or phoneNumber is required.
    type: object
    additionalProperties: false
    properties:
      id:
        description: Redo customer ObjectId. Used for identity resolution. Takes priority over email and phoneNumber when provided.
        type: string
      email:
        description: Customer email address. Used for identity resolution.
        format: email
        type: string
      phoneNumber:
        description: Customer phone number in E.164 format. Used for identity resolution.
        type: string
      firstName:
        description: Customer first name. Applied with patch semantics — does not erase existing value if omitted.
        type: string
      lastName:
        description: Customer last name. Applied with patch semantics — does not erase existing value if omitted.
        type: string
      location:
        description: Customer location for profile enrichment.
        type: object
        additionalProperties: true
      customFields:
        description: Merchant-defined customer attributes as key-value pairs.
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: number
            - type: boolean
  data:
    description: >
      Custom properties for this event (must not exceed 400 properties). The
      size of the event payload must not exceed 5 MB, and each string cannot be
      larger than 100 KB. For a full list of data limits on event payloads, see
      [Limitations](/docs/guides/integrations/custom-events#rate-limits).


      Note any top-level property that is not an object can be used to create
      segments. The `$extra` property records any non-segmentable values that
      can be referenced later, e.g., HTML templates are useful on a segment but
      are not used to create a segment.
    type: object
    properties:
      $extra:
        description: >
          Non-segmentable metadata bucket. Values inside `$extra` are stored on
          the event but excluded from segmentation indexes. Unlike top-level
          data properties, values of 0, null, and empty string are NOT stripped
          inside `$extra`. Use this for large text, debug info, nested objects,
          arrays, or any data you want to reference in templates but not segment
          on.
        type: object
        additionalProperties: true
    additionalProperties:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: string
          format: date-time
  eventTimestamp:
    description: ISO 8601 timestamp when the event occurred. Defaults to current time if not provided.
    format: date-time
    type: string
  value:
    description: Monetary or conversion value associated with the event (e.g., purchase amount).
    type: number
  valueCurrency:
    description: ISO 4217 currency code for the value field (e.g., "USD", "EUR").
    type: string
  uniqueId:
    description: >
      Merchant-controlled deduplication key (1-255 characters). If provided,
      subsequent events with the same uniqueId for the same store are silently
      deduplicated. Use this for safe retries and at-least-once delivery patterns.
    type: string
required:
  - eventName
title: Custom Event Request
type: object
