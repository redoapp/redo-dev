# $schema: https://json-schema.org/draft/2020-12/schema#
description: Contact information for shipping.
properties:
  address:
    $ref: ./address.schema.yaml
  name:
    description: Contact name
    examples: ["John Doe"]
    title: Name
    type: string
  phoneNumber:
    description: Contact phone number
    examples: ["+12025550123"]
    title: Phone Number
    type: string
required:
  - name
  - phoneNumber
  - address
title: Shipping Contact
type: object
