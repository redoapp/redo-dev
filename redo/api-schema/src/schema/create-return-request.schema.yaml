type: object
description: Create return request body.
properties:
  data:
    type: object
    description: Return information payload.
    properties:
      provider:
        type: string
        description: Ecommerce platform provider.
        examples: [shopify]
      externalOrderId:
        type: string
        description: External order ID from the ecommerce platform.
      type:
        type: string
        enum: [return, warranty]
        default: return
        description: Kind of return to create.
      items:
        type: array
        minItems: 1
        description: Items being returned.
        items:
          type: object
          properties:
            lineItemId:
              type: string
              description: External line item ID from the order.
            quantity:
              type: integer
              minimum: 1
              description: Number of units to return.
            reason:
              type: string
              description: Customer-facing return reason.
            reasonCode:
              type: string
              description: Machine-readable reason code.
            compensation:
              type: string
              enum: [refund, store_credit, same_item_replacement]
              description: |
                How the customer should be compensated for this item.

                `same_item_replacement` exchanges each unit for the same variant (Shopify, BigCommerce, and Commerce Cloud orders). The request fails with a `com.getredo.api:return/replacement-unavailable` error listing `unavailableLineItemIds` when the variant is out of stock or deleted. If the variant goes out of stock before the return is processed, the item's value goes to a refund or store credit per the store's exchange settings.
            notes:
              type: string
              description: Customer-facing notes for this item.
          required: [lineItemId, quantity, reason, compensation]
      shippingAddress:
        type: object
        description: Address the customer is shipping from.
        properties:
          line1: { type: string }
          line2: { type: string }
          city: { type: string }
          state: { type: string }
          postalCode: { type: string }
          country:
            type: string
            description: ISO 3166-1 alpha-2 country code.
        required: [line1, city, state, postalCode, country]
      label:
        type: object
        description: Optional return label and tracking details.
        properties:
          trackingNumber:
            type: string
            description: Carrier tracking number.
          carrier:
            type: string
            description: Carrier name.
          trackingUrl:
            type: string
            description: Public tracking URL.
          postageLabelUrl:
            type: string
            description: Postage label URL.
          formLabelUrl:
            type: string
            description: Commercial or form label URL.
          originalShipmentId:
            type: string
            description: Provider shipment identifier to reference.
        required: [trackingNumber]
      notes:
        type: string
        description: Internal merchant-side notes.
      newOrderShipping:
        type: object
        description: |
          Shipping for the exchange order created for replacement items. When omitted, the customer is charged for shipping at the ecommerce platform's own rates.
        properties:
          name:
            type: string
            minLength: 1
            description: Title of the exchange order's shipping line.
          price:
            type: object
            description: Price charged for the exchange order's shipping. Use an amount of `"0"` for free shipping.
            properties:
              amount:
                type: string
                pattern: '^\d+(\.\d+)?$'
                examples: ["0", "5.00"]
                description: Non-negative decimal amount.
              currency:
                type: string
                examples: [USD]
                description: ISO 4217 currency code. Must match the order's currency.
            required: [amount, currency]
        required: [name, price]
    required: [provider, externalOrderId, items, shippingAddress]
  options:
    type: object
    description: Options controlling side effects of the return creation.
    properties:
      createExternalRMAs:
        type: boolean
        description: Whether to create RMAs with external integrations (e.g. ShipBob). Defaults to false.
        default: false
required: [data]
