description: Request body for creating an order.
properties:
  orderId:
    description: Unique identifier for the order.
    type: string
  createdAt:
    description: ISO 8601 date string for when the order was created.
    format: date-time
    type: string
  lineItems:
    description: List of line items in the order.
    items:
      $ref: ./orders-api-line-item.schema.yaml
    minItems: 1
    type: array
  customer:
    $ref: ./orders-api-customer.schema.yaml
  shipping:
    $ref: ./orders-api-shipping.schema.yaml
  totalPrice:
    description: Total order price including tax and shipping, as a decimal amount in the order's currency (e.g. $79.99, not 7999 cents).
    minimum: 0
    type:
      - number
      - "null"
  subtotalPrice:
    description: Subtotal price excluding tax and shipping, as a decimal amount in the order's currency (e.g. $79.99, not 7999 cents).
    minimum: 0
    type:
      - number
      - "null"
  totalTax:
    description: Total tax amount, as a decimal amount in the order's currency (e.g. $79.99, not 7999 cents).
    minimum: 0
    type:
      - number
      - "null"
  totalDiscount:
    description: Total discount amount applied to the order (e.g. coupon codes, promotions), as a decimal amount in the order's currency (e.g. $79.99, not 7999 cents).
    minimum: 0
    type:
      - number
      - "null"
  billingAddress:
    $ref: ./orders-api-billing-address.schema.yaml
  tags:
    description: Optional tags associated with the order.
    items:
      type: string
    type:
      - array
      - "null"
  currencyCode:
    description: "Currency code from the ISO 4217 standard (e.g., USD, EUR, GBP)."
    type:
      - string
      - "null"
  locationId:
    description: >-
      Optional. Pin this order to a specific fulfillment location. Must be a
      location id (`loc_...`) returned by `GET /inventory-levels` — either one
      of your own warehouses or a location at a linked 3PL fulfillment service.
      When provided, the fulfillment group's origin address is sourced from
      the location row. Omit to use your team's default origin address.
    example: loc_4d8e1a2b3c
    type:
      - string
      - "null"
required:
  - orderId
  - createdAt
  - lineItems
type: object
