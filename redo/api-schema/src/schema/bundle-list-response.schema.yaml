# $schema: https://json-schema.org/draft/2020-12/schema#
description: A page of stored bundles.
properties:
  bundles:
    description: The bundles on this page.
    items: { $ref: ./bundle-list-item.schema.yaml }
    title: Bundles
    type: array
  page_continue:
    description:
      Send as `X-Page-Continue` to fetch the next page. Absent on the last
      page, and absent entirely when filtering by `parent_sku`.
    example: "50"
    title: Page Continue
    type: string
  sku_resolved:
    description:
      Present only when `parent_sku` was supplied. `false` means no product in
      your catalog has that SKU, which is different from the SKU existing but
      having no bundle.
    title: SKU Resolved
    type: boolean
required: [bundles]
title: Bundle List Response
type: object
