# $schema: https://json-schema.org/draft/2020-12/schema#
description: Storefront cart.
properties:
  lineItems:
    description: Line items.
    items:
      properties:
        coupons:
          items:
            properties:
              code:
                type: string
              discountAmount:
                $ref: ./money.schema.yaml
                description:
                  The amount this coupon discounts in dollars for this line
                  item.
              id:
                type: string
            type: object
          type: array
        id:
          description: Line item ID.
          title: ID
          type: string
        originalPrice:
          $ref: ./money.schema.yaml
          description: Original price.
          title: Original Price
        priceTotal:
          $ref: ./money.schema.yaml
          description: Total price.
          title: Price
        product:
          description: Product.
          properties:
            id:
              title: ID
              type: string
          type: object
        quantity:
          description: Quantity.
          title: Quantity
          type: integer
        variant:
          description: Variant.
          properties:
            id:
              title: ID
              type: string
          type: object
      required: [id, quantity, product, variant]
      type: object
    title: Line items
    type: array
  priceTotal:
    $ref: ./money.schema.yaml
    description: Total price.
    title: Price
required: [lineItems]
title: Storefront Cart
type: object
