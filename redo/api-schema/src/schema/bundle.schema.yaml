# $schema: https://json-schema.org/draft/2020-12/schema#
description:
  A bundle definition, identified by the SKU of the product that represents the
  bundle itself.
properties:
  parent_sku:
    description:
      SKU of the product shoppers buy. This identifies the bundle, and is what a
      later request replaces. Matched exactly, so it is case-sensitive.
    example: BUNDLE-STARTER-KIT
    title: Parent SKU
    type: string
  parent_variant_id:
    description:
      Which variant to use when `parent_sku` is on more than one variant in
      your catalog. Only needed after a result of `ambiguous`; take the value
      from its `variant_ids`.
    example: "55518673568035"
    title: Parent Variant ID
    type: string
  children_skus:
    description:
      The products contained in the bundle. Listing the same SKU twice adds the
      quantities together.
    items:
      properties:
        sku:
          description: SKU of a product included in the bundle. Case-sensitive.
          example: SOCKS-BLK-L
          title: SKU
          type: string
        quantity:
          default: 1
          description: How many units of this SKU the bundle contains.
          example: 2
          maximum: 100
          minimum: 1
          title: Quantity
          type: integer
        variant_id:
          description:
            Which variant to use when `sku` is on more than one variant in your
            catalog. Only needed after a result of `ambiguous`.
          example: "55518673404195"
          title: Variant ID
          type: string
      required: [sku]
      type: object
    minItems: 1
    title: Children SKUs
    type: array
  return_types:
    description:
      Return types this bundle applies to. Omit the field, or send an empty
      list, to apply the bundle to every return type.
    items:
      enum: [claim, return, warranty, recycle, withdrawal]
      type: string
    title: Return Types
    type: array
required: [parent_sku, children_skus]
title: Bundle
type: object
