# $schema: https://json-schema.org/draft/2020-12/schema#
description: Shipping rate information.
properties:
  carrier:
    properties:
      id:
        description: ID for the carrier account that provides the shipping rate.
        title: Carrier Account ID
        type: string
      name:
        description: Carrier display name
        examples: ["USPS", "FedEx"]
        title: Carrier Name
        type: string
    required:
      - id
      - name
    type: object
  price:
    $ref: ./money.schema.yaml
  service:
    properties:
      name:
        description: Service level name
        examples: ["Priority", "Ground"]
        title: Service Name
        type: string
    required:
      - name
    type: object
required:
  - carrier
  - price
  - service
title: Shipment Rate
type: object
