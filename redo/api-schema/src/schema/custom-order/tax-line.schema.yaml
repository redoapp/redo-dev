# $schema: https://json-schema.org/draft/2020-12/schema#
description: Tax line item
properties:
  priceSet:
    $ref: ./money-set.schema.yaml
    description: Tax amount
    title: Price Set
  rate:
    description: Tax rate as a decimal string. Send null when the rate is unknown.
    title: Rate
    type: [string, "null"]
  title:
    description: Tax title/name. Defaults to "Tax" when omitted.
    title: Title
    type: string
required: [priceSet, rate]
title: Tax Line
type: object
