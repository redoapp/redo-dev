# $schema: https://json-schema.org/draft/2020-12/schema#
description: |
  A refund already issued against the order in your system.

  Refunds are informational: Redo uses them to know what has already been
  returned to the shopper, and does not issue them. Send every refund on the
  order each time you sync it.
properties:
  id:
    description: Refund ID in external system. Unique within the order.
    title: ID
    type: string
  createdAt:
    description: Timestamp the refund was issued
    title: Created At
    type: string
  note:
    description: Note recorded with the refund
    title: Note
    type: [string, "null"]
  lineItems:
    default: []
    description: Line items refunded by this refund
    items:
      $ref: ./custom-order-refund-line-item.schema.yaml
    title: Line Items
    type: array
  shippingRefunds:
    default: []
    description: Shipping amounts refunded by this refund
    items:
      $ref: ./custom-order-refund-amount.schema.yaml
    title: Shipping Refunds
    type: array
  orderLevelRefunds:
    default: []
    description:
      Amounts refunded against the order as a whole rather than a line item or
      shipping, such as a goodwill adjustment.
    items:
      $ref: ./custom-order-refund-amount.schema.yaml
    title: Order Level Refunds
    type: array
required: [id, createdAt]
title: Custom Order Refund
type: object
