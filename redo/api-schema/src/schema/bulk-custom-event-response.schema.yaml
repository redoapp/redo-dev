# $schema: https://json-schema.org/draft/2020-12/schema#
additionalProperties: false
description: Response from a bulk custom event creation request. Includes per-event results to support partial failure handling.
properties:
  total:
    description: Total number of events in the request.
    type: integer
  accepted:
    description: Number of events successfully accepted for processing.
    type: integer
  rejected:
    description: Number of events that failed validation.
    type: integer
  events:
    description: Per-event results in the same order as the request.
    type: array
    items:
      type: object
      properties:
        index:
          description: Zero-based index of the event in the request array.
          type: integer
        event_id:
          description: The unique identifier for the accepted event. Present only for accepted events.
          type: string
        event_name:
          description: The name of the custom event.
          type: string
        status:
          description: Whether the event was accepted or rejected.
          enum:
            - queued
            - rejected
          type: string
        error:
          description: Error message explaining why the event was rejected. Present only for rejected events.
          type: string
      additionalProperties: false
      required:
        - index
        - event_name
        - status
required:
  - total
  - accepted
  - rejected
  - events
title: Bulk Custom Event Response
type: object
