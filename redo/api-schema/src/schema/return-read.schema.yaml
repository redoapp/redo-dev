# $schema: https://json-schema.org/draft/2020-12/schema#
description: Return read.
properties:
  createdAt:
    description: Time of creation.
    format: date-time
    title: Created at
    type: string
  destination:
    properties:
      mailingAddress:
        $ref: ./address.schema.yaml
        description: Mailing address to send the returned items.
        title: Mailing address
      phoneNumber:
        $ref: ./phone-number.schema.yaml
        description: Phone number of the destination.
        title: Phone number
    type: object
  exchange:
    description: Exchange order
    properties:
      itemCount:
        description: Total quantity of all exchange items
        type: integer
      items:
        items:
          properties:
            id:
              title: ID
              type: string
            price:
              description: Subtotal price for the exchange item including discounts
              properties:
                amount:
                  type: string
                currency:
                  type: string
                tax:
                  type: string
              type: object
            originalPrice:
              description: Original price for the exchange item without discounts and taxes
              properties:
                amount: 
                  type: string
                currency:
                  type: string
              type: object
            product:
              $ref: ./product.schema.yaml
              title: Product
            quantity:
              $ref: ./item-quantity.schema.yaml
              title: Quantity
            variant:
              $ref: ./product-variant.schema.yaml
          required: [id, quantity, variant]
        title: Line items
        type: array
      order:
        properties:
          externalId:
            description: ID of external order
            title: External ID
            type: string
        type: object
      provision:
        $ref: ./exchange-provision.schema.yaml
        title: Provision
      totalTax:
        description: Total tax for exchange items
        properties:
          amount:
            type: string
          currency:
            type: string
        type: object
    required: [items, provision]
    title: Exchange
    type: object
  externalOrderIds:
    description: Array of external order IDs associated with this return
    items:
      type: string
    title: External Order IDs
    type: array
  giftCards:
    description: Gift card(s) created for return
    items:
      properties:
        amount:
          $ref: ./money.schema.yaml
          title: Amount
        code:
          description: Gift card 16 digit code.
          title: Code
          type: string
        externalId:
          description: Gift card ID.
          title: ID
          type: string
      required: [amount, code, externalId]
      type: object
    title: Gift cards
    type: array
  id:
    description: Return identifier.
    examples: [64df65d4c5a4ca3eff4b4e43]
    title: Identifier
    type: string
  items:
    description: Return items
    items:
      properties:
        customerComment:
          description: Customer's comment about the return
          type: string
        exchangeItem:
          description:
            Exchange item details if this return item is being exchanged
          properties:
            product:
              properties:
                externalId:
                  type: string
                name:
                  type: string
              type: object
            quantity:
              type: integer
            variant:
              properties:
                externalId:
                  type: string
                name:
                  type: string
              type: object
          title: Exchange item
          type: object
        greenReturn:
          description:
            Whether this is a green return (no physical return required)
          type: boolean
        id:
          description: Return item ID.
          title: ID
          type: string
        orderItem:
          description: Order line item
          properties:
            id:
              description:
                "Line item reference ID in format: {orderId}/{lineItemIndex}"
              title: ID
              type: string
            line_item_id:
              description: Original Shopify line item ID
              title: Line Item ID
              type: string
          required: [id]
          title: Order item
          type: object
        productId:
          description: Product ID
          type: string
        quantity:
          description: Quantity of items being returned
          type: integer
        reason:
          description: Primary return reason
          examples: [Too big, Other]
          type: string
        reasonCode:
          description: Return reason code
          type: string
        reasons:
          description: Array of return reasons
          items:
            type: string
          type: array
        refund:
          description: Refund details
          properties:
            amount:
              $ref: ./money.schema.yaml
              title: Amount
            type:
              description: Refund strategy
              type: string
          required: [amount]
          type: object
        sku:
          description: Product SKU
          type: string
        status:
          description: Return item status
          type: string
        variantId:
          description: Product variant ID
          type: string
      required: [id, orderItem, quantity, reason]
      type: object
    type: array
  notes:
    description: Teammembers generated notes and comments on the return
    items:
      properties:
        image:
          description: Optional image URL attached to the note
          title: Image URL
          type: string
        message:
          description: The note text
          title: Message
          type: string
      required: [message]
      type: object
    title: Notes
    type: array
  order:
    description: Original order.
    properties:
      id:
        description: Order ID.
        example: abc123
        title: ID
        type: string
    required: [id]
    title: Order
    type: object
  shipment:
    $ref: ./return-shipment.schema.yaml
    description: Shipment, if has been made
    title: Shipment
  shipments:
    description: Array of all shipments associated with this return
    items:
      $ref: ./return-shipment.schema.yaml
    title: Shipments
    type: array
  shopifyOrderIds:
    description: Array of Shopify order IDs (deprecated, use externalOrderIds)
    items:
      type: string
    title: Shopify Order IDs
    type: array
  source:
    properties:
      emailAddress:
        description: Email address.
        format: email
        title: Email address
        type: string
      mailingAddress:
        $ref: ./address.schema.yaml
        description: Mailing address returned items are sent from.
        title: Mailing address
      name:
        $ref: ./person-name.schema.yaml
        description: Name of returner.
        title: Name
      phoneNumber:
        $ref: ./phone-number.schema.yaml
        description: Phone number of returner.
        title: Phone number
    required: [emailAddress, mailingAddress, name, phoneNumber]
    type: object
  status:
    $ref: ./return-status.schema.yaml
    description: Return status.
    title: Status
  totals:
    description: Calculated totals for the return
    properties:
      charge:
        description: The upsell amount for the exchange order
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
      exchange:
        description: Total value of new items in exchange
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
      refund:
        description: Total refund amount excluding shipping
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
      storeCredit:
        description: Total store credit amount
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
    required: [refund, exchange, storeCredit, charge]
    title: Totals
    type: object
  type:
    $ref: ./return-type.schema.yaml
    description: Return type.
    title: Type
  updatedAt:
    description: Time of last update.
    format: date-time
    title: Updated at
    type: string
required:
  - createdAt
  - destination
  - giftCards
  - source
  - id
  - order
  - items
  - status
  - updatedAt
title: Return
type: object
