# $schema: https://json-schema.org/draft/2020-12/schema#
description: Return read.
properties:
  compensationMethods:
    description: Array of compensation methods available for this return
    items:
      enum: [refund, store_credit, exchange]
      type: string
    title: Compensation Methods
    type: array
  completeWithNoAction:
    description: Whether this return can be completed with no action
    title: Complete With No Action
    type: boolean
  createdAt:
    description: Time of creation.
    format: date-time
    title: Created at
    type: string
  destination:
    properties:
      mailingAddress:
        $ref: ./address.schema.yaml
        description: Mailing address to send the returned items.
        title: Mailing address
      phoneNumber:
        $ref: ./phone-number.schema.yaml
        description: Phone number of the destination.
        title: Phone number
    type: object
  exchange:
    description: Exchange order
    properties:
      itemCount:
        description: Total quantity of all exchange items
        type: integer
      items:
        items:
          properties:
            id:
              title: ID
              type: string
            originalPrice:
              description:
                Original price for the exchange item without discounts and taxes
              properties:
                amount:
                  type: string
                currency:
                  type: string
              type: object
            price:
              description:
                Subtotal price for the exchange item including discounts
              properties:
                amount:
                  type: string
                currency:
                  type: string
                tax:
                  type: string
              type: object
            product:
              $ref: ./product.schema.yaml
              title: Product
            quantity:
              $ref: ./item-quantity.schema.yaml
              title: Quantity
            variant:
              $ref: ./product-variant.schema.yaml
          required: [id, quantity, variant]
        title: Line items
        type: array
      order:
        properties:
          externalId:
            description: ID of external order
            title: External ID
            type: string
        type: object
      provision:
        $ref: ./exchange-provision.schema.yaml
        title: Provision
      totalTax:
        description: Total tax for exchange items
        properties:
          amount:
            type: string
          currency:
            type: string
        type: object
    required: [items, provision]
    title: Exchange
    type: object
  externalOrderIds:
    description: Array of external order IDs associated with this return
    items:
      type: string
    title: External Order IDs
    type: array
  externalReturnIds:
    description: Array of external return identifiers associated with this return. For Shopify returns, value is Shopify's numeric return ID as a string, not a Shopify admin URL or gid:// ID.
    examples:
      - [{ provider: shopify, value: "12345" }]
    items:
      properties:
        provider:
          description: External provider that owns this return identifier
          enum: [shopify]
          type: string
        value:
          description: Return identifier value from the external provider
          type: string
      required: [provider, value]
      type: object
    title: External Return IDs
    type: array
  giftCards:
    description: Gift card(s) created for return
    items:
      properties:
        amount:
          $ref: ./money.schema.yaml
          title: Amount
        code:
          description: Gift card 16 digit code.
          title: Code
          type: string
        externalId:
          description: Gift card ID.
          title: ID
          type: string
      required: [amount, code, externalId]
      type: object
    title: Gift cards
    type: array
  id:
    description: Return identifier.
    examples: [64df65d4c5a4ca3eff4b4e43]
    title: Identifier
    type: string
  internalCreatedByName:
    description: Name of the internal team member who created this return
    title: Internal Created By Name
    type: string
  items:
    description: Return items
    items:
      properties:
        customerComment:
          description: Customer's comment about the return
          type: string
        exchangeItem:
          description:
            Exchange item details if this return item is being exchanged
          properties:
            product:
              properties:
                externalId:
                  type: string
                name:
                  type: string
              type: object
            quantity:
              type: integer
            variant:
              properties:
                externalId:
                  type: string
                name:
                  type: string
              type: object
          title: Exchange item
          type: object
        grade:
          description:
            Merchant-assigned grade for the returned item (e.g. condition or
            quality tier). Null if the merchant has not graded this item.
          title: Grade
          type: string
          nullable: true
        greenReturn:
          description:
            Whether this is a green return (no physical return required)
          type: boolean
        outcome:
          description:
            Merchant-assigned processing outcome for the returned item (e.g.
            restock, dispose). Null if the merchant has not set an outcome
            for this item.
          title: Outcome
          type: string
          nullable: true
        shipmentGroupIds:
          description: IDs of the shipment groups this return item belongs to
          items:
            type: string
          title: Shipment Group IDs
          type: array
        id:
          description: Return item ID.
          title: ID
          type: string
        orderItem:
          description: Order line item
          properties:
            id:
              description:
                "Line item reference ID in format: {orderId}/{lineItemIndex}"
              title: ID
              type: string
            line_item_id:
              description: Original Shopify line item ID
              title: Line Item ID
              type: string
          required: [id]
          title: Order item
          type: object
        externalReturnLineItemId:
          description: External return line item ID
          title: External Return Line Item ID
          type: string
        productId:
          description: Product ID
          type: string
        quantity:
          description: Quantity of items being returned
          type: integer
        reason:
          description: Primary return reason
          examples: [Too big, Other]
          type: string
        reasonCode:
          description: Return reason code
          type: string
        reasons:
          description: Array of return reasons
          items:
            type: string
          type: array
        reasonCodes:
          description: Array of return reason codes
          items:
            type: string
          type: array
        productAdjustment:
          description: Product adjustment details
          type: string
        multipleChoiceQuestions:
          description: Multiple choice questions and answers for this return item
          items:
            properties:
              question:
                description: The question text
                type: string
              answer:
                description: The selected answer
                type: string
            required: [question, answer]
            type: object
          type: array
        assessments:
          description: Assessment records for this return item. Only applicable for warranties.
          items:
            properties:
              assignedUser:
                description: User assigned to this assessment
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
                  email:
                    type: string
                required: [id, name, firstName, lastName, email]
                type: object
              responses:
                description: Assessment responses
                items:
                  discriminator:
                    propertyName: type
                  oneOf:
                    - title: Short Text Response
                      properties:
                        type:
                          const: short_text
                          type: string
                        value:
                          description: Short text response value
                          type: string
                      required: [type, value]
                      type: object
                    - title: Long Text Response
                      properties:
                        type:
                          const: long_text
                          type: string
                        value:
                          description: Long text response value
                          type: string
                      required: [type, value]
                      type: object
                    - title: Select Response
                      properties:
                        type:
                          const: select
                          type: string
                        value:
                          description: Select response values (array of selected options)
                          items:
                            type: string
                          type: array
                      required: [type, value]
                      type: object
                    - title: Number Response
                      properties:
                        type:
                          const: number
                          type: string
                        value:
                          description: Number response value
                          type: number
                      required: [type, value]
                      type: object
                    - title: Boolean Response
                      properties:
                        type:
                          const: boolean
                          type: string
                        value:
                          description: Boolean response value
                          type: boolean
                      required: [type, value]
                      type: object
                    - title: File Upload Response
                      properties:
                        type:
                          const: file_upload
                          type: string
                        value:
                          description: File upload response values (array of file URLs or identifiers)
                          items:
                            type: string
                          type: array
                      required: [type, value]
                      type: object
                    - title: Date Response
                      properties:
                        type:
                          const: date
                          type: string
                        value:
                          description: Date response value
                          format: date-time
                          type: string
                      required: [type, value]
                      type: object
                type: array
            required: [assignedUser, responses]
            type: object
          type: array
        refund:
          description: Refund details
          properties:
            amount:
              $ref: ./money.schema.yaml
              title: Amount
            type:
              description: Refund strategy
              type: string
          required: [amount]
          type: object
        productValueNoTaxNoAdjustment:
          description:
            Per-product value before taxes and merchant adjustments. Equivalent
            to the "Product Value (No Tax/Adjustment)" column in the Returns
            Report.
          properties:
            amount:
              $ref: ./money.schema.yaml
              title: Amount
          required: [amount]
          title: Product value (no tax / no adjustment)
          type: object
        sku:
          description: Product SKU
          type: string
        upc:
          description: Universal Product Code (barcode) snapshotted from the product at return-creation time. Null if no barcode was recorded.
          title: UPC
          type: string
          nullable: true
        status:
          description: Return item status
          type: string
        variantId:
          description: Product variant ID
          type: string
      required: [id, orderItem, quantity, reason]
      type: object
    type: array
  notes:
    description: Teammembers generated notes and comments on the return
    items:
      properties:
        image:
          description: Optional image URL attached to the note
          title: Image URL
          type: string
        message:
          description: The note text
          title: Message
          type: string
      required: [message]
      type: object
    title: Notes
    type: array
  order:
    description: Original order.
    properties:
      id:
        description: Redo's internal identifier for the original order created in Redo.
        example: 64e4da943dd822979a70bd12
        title: ID
        type: string
      name:
        description: Order name from the external provider, such as the Shopify order name.
        examples: ["#123"]
        title: Name
        type: string
    required: [id]
    title: Order
    type: object
  protection:
    description:
      The Redo coverage behind this return and who it left paying for the
      label. Coverage is reported independently of who paid, so a covered
      order can still leave the merchant or the shopper paying for the label.
    properties:
      covered:
        description:
          Whether any order on the return carried Redo coverage, meaning
          returns coverage or package protection.
        title: Covered
        type: boolean
      finalSaleCoverage:
        description:
          Whether any order on the return carried Redo final-sale returns
          coverage.
        title: Final sale coverage
        type: boolean
      labelPayer:
        description: Who pays for the return label. Null before a payer is settled.
        enum: [customer, merchant, redo, null]
        title: Label payer
        type:
          - string
          - "null"
      labelPayerReason:
        description: Why the label fell to that payer.
        enum:
          [
            REDO_PAYS_ALL_LABELS,
            REDO_ORDER_HAS_FINAL_SALE_PROTECTION,
            REDO_ORDER_HAS_RETURNS_COVERAGE,
            REDO_ORDER_HAS_WARRANTY_COVERAGE,
            REDO_RECYCLING_SETTING,
            MERCHANT_DAMAGED_OR_WRONG_PRODUCT,
            MERCHANT_SAFETY_NET,
            MERCHANT_RECYCLING_SETTING,
            SHOPPER_UNCOVERED,
            SHOPPER_RECYCLING_SETTING,
            null,
          ]
        title: Label payer reason
        type:
          - string
          - "null"
      packageProtection:
        description:
          Whether any order on the return carried Redo package protection.
        title: Package protection
        type: boolean
      returnsCoverage:
        description:
          Whether any order on the return carried Redo returns coverage.
        title: Returns coverage
        type: boolean
    required:
      [
        covered,
        returnsCoverage,
        packageProtection,
        finalSaleCoverage,
        labelPayer,
        labelPayerReason,
      ]
    title: Protection
    type: object
  shipment:
    $ref: ./return-shipment.schema.yaml
    description: Shipment, if has been made
    title: Shipment
  shipments:
    description: Array of all shipments associated with this return
    items:
      $ref: ./return-shipment.schema.yaml
    title: Shipments
    type: array
  dropoffs:
    description: Array of QR-code-based dropoff entries for returns using drop-off methods such as BlueYonder/FedEx Easy Returns. Empty for standard label-based returns.
    items:
      $ref: ./return-dropoff.schema.yaml
    title: Dropoffs
    type: array
  shopifyOrderIds:
    description: Array of Shopify order IDs (deprecated, use externalOrderIds)
    items:
      type: string
    title: Shopify Order IDs
    type: array
  source:
    properties:
      emailAddress:
        description: Email address.
        format: email
        title: Email address
        type: string
      mailingAddress:
        $ref: ./address.schema.yaml
        description: Mailing address returned items are sent from.
        title: Mailing address
      name:
        $ref: ./person-name.schema.yaml
        description: Name of returner.
        title: Name
      phoneNumber:
        $ref: ./phone-number.schema.yaml
        description: Phone number of returner.
        title: Phone number
    required: [emailAddress, mailingAddress, name, phoneNumber]
    type: object
  status:
    $ref: ./return-status.schema.yaml
    description: Return status.
    title: Status
  tags:
    description: Tags associated with this return
    items:
      properties:
        name:
          description: The tag's display name
          type: string
        source:
          description: The source of the tag
          type: string
      required: [name, source]
      type: object
    title: Tags
    type: array
  totals:
    description: Calculated totals for the return
    properties:
      charge:
        description: The upsell amount for the exchange order
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
      exchange:
        description: Total value of new items in exchange
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
      refund:
        description: Total refund amount excluding shipping
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
      shippingFee:
        description:
          Return shipping fee paid by the customer, whether charged directly or
          deducted from the refund, store credit, or exchange. "0.00" when the
          customer paid nothing.
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
      storeCredit:
        description: Total store credit amount
        properties:
          amount:
            $ref: ./money.schema.yaml
        required: [amount]
        type: object
    required: [refund, exchange, storeCredit, charge]
    title: Totals
    type: object
  type:
    $ref: ./return-type.schema.yaml
    description: Return type.
    title: Type
  updatedAt:
    description: Time of last update.
    format: date-time
    title: Updated at
    type: string
required:
  - createdAt
  - destination
  - giftCards
  - source
  - id
  - order
  - protection
  - items
  - status
  - updatedAt
title: Return
type: object
