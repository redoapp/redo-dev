# $schema: https://json-schema.org/draft/2020-12/schema#
description: Customer profile.
properties:
  id:
    description: Redo customer ID
    examples: [67bd4f1a2e3c8d001a5f9b12]
    type: string
  email:
    description: Customer email address
    format: email
    examples: ["jane@example.com"]
    type: string
  firstName:
    description: Customer first name
    examples: ["Jane"]
    type: string
  lastName:
    description: Customer last name
    examples: ["Smith"]
    type: string
  phoneNumber:
    description: Customer phone number in E.164 format
    examples: ["+11234567890"]
    type: string
  location:
    $ref: ./customer-location.schema.yaml
  customFields:
    description: >-
      Custom field values as key-value pairs, where keys are field names and
      values can be strings, numbers, or booleans. DATE custom field values
      are returned as ISO 8601 datetime strings (e.g.,
      "2026-01-15T12:00:00.000Z"), not Date objects.
    type: object
    additionalProperties:
      oneOf:
        - type: string
        - type: number
        - type: boolean
    examples:
      - subscription_source: "web"
        status: "Active"
        loyalty_points: 1250
        vip_member: true
        signup_date: "2026-02-24T12:15:00.000Z"
  createdAt:
    description: Timestamp when the customer was created. May be null for older customers created before this field was tracked.
    format: date-time
    title: Created at
    examples: ["2026-02-20T18:30:00.000Z"]
    type:
      - string
      - "null"
  updatedAt:
    description: Timestamp when the customer was last updated. May be null for older customers created before this field was tracked.
    format: date-time
    title: Updated at
    examples: ["2026-02-24T12:15:00.000Z"]
    type:
      - string
      - "null"
required:
  - id
  - email
title: Customer
type: object
