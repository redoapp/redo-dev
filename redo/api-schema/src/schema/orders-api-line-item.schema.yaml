description: Line item in the order.
properties:
  id:
    description: >-
      Unique identifier for the line item. Must not contain the `-`
      character — Redo uses `-` as a delimiter when encoding line item
      ids into internal returns-accounting keys, and an id containing
      `-` will cause draft return creation to fail with a
      `LineItemNotFoundError`. Use alphanumeric ids (e.g. `LI001`,
      `12345`).
    pattern: "^[^-]+$"
    type: string
  productId:
    description: Identifier for the product.
    type: string
  variantId:
    description: Identifier for the product variant.
    type:
      - string
      - "null"
  title:
    description: Title/name of the product.
    type: string
  sku:
    description: SKU of the product.
    type:
      - string
      - "null"
  quantity:
    description: Quantity of the product ordered.
    minimum: 1
    maximum: 1000
    type: integer
  price:
    description: Price per unit of the product before discounts.
    minimum: 0
    type:
      - number
      - "null"
  imageUrl:
    description: URL to the product image.
    maxLength: 2048
    type:
      - string
      - "null"
  discount:
    description: Total discount amount applied to this line item.
    minimum: 0
    type:
      - number
      - "null"
required:
  - id
  - productId
  - title
  - quantity
type: object
