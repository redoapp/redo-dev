description: Marketing subscription status
properties:
  subscriptionStatus:
    description: Subscription status
    enum: [subscribed, confirmed, unsubscribed]
    type: string
  triggerAutomations:
    default: false
    description:
      Whether to trigger automations for this subscription change. Defaults to
      false.
    type: boolean
  updatedAt:
    description: ISO 8601 timestamp. If not provided, defaults to now.
    format: date-time
    type: string
required:
  - subscriptionStatus
type: object
