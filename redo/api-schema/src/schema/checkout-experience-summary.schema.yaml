description: >-
  A checkout experience: a named group of shipping methods shown together at
  checkout. It does not decide who sees it — the checkout tree does. An
  experience can also group checkout widgets and a post-purchase upsell page;
  this summary covers only its shipping methods.
properties:
  id:
    description:
      Checkout experience ID. Pass it to `GET
      /stores/{storeId}/checkout-experiences/{checkoutExperienceId}` for full
      detail.
    example: 66b2f1c9e4b0a1d2c3f4a5b6
    type: string
  name:
    description: Merchant-facing name of the checkout experience.
    example: Standard rates
    type: string
  active:
    description:
      True when this experience is reachable in the team's live checkout tree,
      i.e. real shoppers can be served it.
    example: true
    type: boolean
  createdAt:
    description: Creation timestamp, ISO 8601 UTC.
    example: "2026-08-12T15:04:05.000Z"
    type: string
  methods:
    description: >-
      Shipping methods this experience offers. Summary only: call `GET
      /stores/{storeId}/checkout-experiences/{checkoutExperienceId}` for prices,
      carriers, conditions, constraints, and which methods are auto-selected.
    items:
      properties:
        id:
          description: Shipping method ID, unique within the team.
          example: 66b2f1c9e4b0a1d2c3f4a5c7
          type: string
        name:
          description:
            Shopper-facing name of the shipping method as it appears at
            checkout, e.g. 'Standard'.
          example: Standard
          type: string
        description:
          description: Shopper-facing description shown next to the method.
          example: 5-8 business days
          type: string
        priceDisplay:
          description: >-
            Human-readable price for this method: 'FREE', a formatted amount
            like '$5.99', 'DYNAMIC' for carrier-calculated rates, 'CUSTOM' for
            merchant-scripted rates, or '-' when no price is configured.
            Reflects only the FIRST configured price, so a method that prices by
            cart weight or cart value, or that has a free-shipping threshold,
            may read 'FREE' while most carts are charged something else. Call
            `GET /stores/{storeId}/checkout-experiences/{checkoutExperienceId}`
            for every price and the conditions each applies to.
          example: $5.99
          type: string
      required: [id, name, description, priceDisplay]
      type: object
    type: array
required: [id, name, active, createdAt, methods]
title: Checkout experience summary
type: object
