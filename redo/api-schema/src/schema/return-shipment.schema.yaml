# $schema: https://json-schema.org/draft/2020-12/schema#
description: Return shipment tracking information
properties:
  carrier:
    description: Carrier code
    title: Carrier
    type: string
  status:
    description: Status of shipment
    enum:
      - unknown
      - pre_transit
      - in_transit
      - out_for_delivery
      - available_for_pickup
      - cancelled
      - delivered
      - error
      - failure
      - return_to_sender
      - expired
    title: Status
    type: string
  tracker:
    description: Tracking number
    title: Tracker
    type: string
  trackingUrl:
    description: Tracking URL
    title: Tracking URL
    type: string
  postageLabel:
    description: Postage label URL
    title: Postage Label
    type: string
  formLabel:
    description: Form label URL
    title: Form Label
    type: string
  shipmentGroupId:
    description: ID of the shipment group this shipment belongs to
    title: Shipment Group ID
    type: string
  itemIds:
    description: IDs of the return items included in this shipment
    items:
      type: string
    title: Item IDs
    type: array
  externalLocationId:
    description: External location ID for the destination of this shipment
    title: External Location ID
    type: string
  estimatedDeliveryDate:
    description: Estimated delivery date for this shipment
    title: Estimated Delivery Date
    type: string
  deliveredAt:
    description: Date and time this shipment was delivered
    title: Delivered At
    type: string
title: Return Shipment
type: object
