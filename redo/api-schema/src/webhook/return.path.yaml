post:
  operationId: "Webhook return event"
  requestBody:
    content:
      application/json:
        schema:
          description: Return event
          properties:
            at:
              description: Event time
              format: date-time
              title: At
              type: string
            merchantName:
              description: Name of the merchant team that owns this return.
              title: Merchant Name
              type: string
            order:
              $ref: ../schema/order-read.schema.yaml
              description: Order for return.
              title: Order
            return:
              $ref: ../schema/return-read.schema.yaml
              description: Return.
              title: Return
            type:
              description: Event type
              enum:
                - backfill
                - created
                - updated
              type: string
          type: object
    description: |
      Return event webhook.
    required: true
  responses:
    "2XX":
      description: Success. Return a 2xx status code to indicate success.
    default:
      description:
        Error. The event will be retried multiple times and then discarded.
  security:
    - UserBearer: []
  summary: "Return event"
  tags:
    - Returns
