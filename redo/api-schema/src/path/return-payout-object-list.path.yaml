description: Return a list of invoices.
get:
  description: Get a list of invoices.
  operationId: Invoice list
  parameters: [{ $ref: ../param/store-id.param.yaml }]
  responses:
    "200":
      content:
        application/json:
          schema:
            properties:
              invoices:
                items:
                  $ref: ../schema/invoice.schema.yaml
                type: array
            required: [invoices]
            type: object
      description: Success
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: List Invoices
  tags: [Invoices]
summary: Invoice
