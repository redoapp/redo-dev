description: Get a customer.
get:
  description:
    Get a customer by email. Returns the customer profile if found.
  operationId: Customer get
  parameters:
    - $ref: ../param/store-id.param.yaml
    - description: Customer email address
      in: query
      name: email
      required: true
      schema:
        format: email
        type: string
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: ../schema/customer-response.schema.yaml
      description: Customer found
    "400":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Bad Request
    "404":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Customer Not Found
    "500":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Internal Server Error
    default:
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Error
  security:
    - Bearer: []
  summary: Get Customer
  tags:
    - Customers
summary: Get customer
