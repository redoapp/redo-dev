description: Fetch available shipping label rates.
post:
  description:
    Get available shipping rates based on origin, destination, and parcel
    information.
  operationId: Shipment rates
  requestBody:
    content:
      application/json:
        schema:
          properties:
            destination:
              properties:
                address:
                  $ref: ../schema/address.schema.yaml
              required: [address]
              type: object
            origin:
              properties:
                address:
                  $ref: ../schema/address.schema.yaml
              required: [address]
              type: object
            parcel:
              $ref: ../schema/parcel.schema.yaml
          required: [origin, destination, parcel]
          type: object
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            properties:
              rates:
                description: Available shipping rates
                items:
                  $ref: ../schema/shipment-rate.schema.yaml
                type: array
            required: [rates]
            type: object
      description: Success
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: Get shipping rates
  tags: [Shipping]
summary: Shipment Rates
