post:
  description: |
    Create a custom event to trigger flows with merchant-defined event names and properties.

    Custom events allow merchants to trigger flows based on events from their own systems.
    Events can include custom properties that are accessible in email and SMS templates,
    and are persisted for segmentation and historical queries.

    ## Identity Resolution
    The API resolves customers using the following priority order:
    1. `customer.id` — Redo customer ObjectId (highest priority)
    2. `customer.email` — customer email address
    3. `customer.phoneNumber` — customer phone number

    At least one identifier must be provided. If no matching customer is found, one will
    be created automatically. If `customer.id` is provided but not found, the API falls
    back to email/phone rather than returning 404.

    ## Rate Limiting
    This endpoint is rate-limited to 100 requests per second per store.
  operationId: Custom event create
  parameters:
    - $ref: "../param/store-id.param.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schema/custom-event-request.schema.yaml"
        examples:
          full_example:
            summary: Full event with value, data, and $extra
            value:
              eventName: "purchase_milestone_reached"
              customer:
                email: "customer@example.com"
                firstName: "Test"
                lastName: "User"
              eventTimestamp: "2026-04-02T12:00:00Z"
              value: 299.99
              valueCurrency: "USD"
              uniqueId: "milestone-test-001"
              data:
                milestone_type: "100th_purchase"
                total_spent: 5000
                vip_tier: "gold"
                enrolled_at: "2025-01-01T00:00:00Z"
                $extra:
                  raw_webhook_payload:
                    nested: true
                    items: [1, 2, 3]
                  zero_val: 0
                  empty_str: ""
          simple:
            summary: Minimal event with just a name and email
            value:
              eventName: "user_registered"
              customer:
                email: "customer@example.com"
              data:
                plan_type: "premium"
                referral_code: "FRIEND123"
                source: "mobile_app"
          with_phone:
            summary: Event identified by phone number
            value:
              eventName: "purchase_completed"
              customer:
                phoneNumber: "+12065551234"
              data:
                item_count: 3
                category: "apparel"
              value: 149.99
              valueCurrency: "USD"
    required: true
  responses:
    "202":
      content:
        application/json:
          schema:
            $ref: "../schema/custom-event-response.schema.yaml"
          examples:
            success:
              summary: Event accepted
              value:
                eventId: "evt_abc123def456"
                status: "queued"
                eventName: "user_registered"
      description: Event accepted and queued for processing
    "400":
      content:
        application/json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Invalid request body or missing required customer identifier
    "404":
      content:
        application/json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Store not found
    "429":
      content:
        application/json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Rate limit exceeded
    default:
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Error
  security:
    - Bearer: []
  summary: Create custom event
  tags:
    - Custom Events
