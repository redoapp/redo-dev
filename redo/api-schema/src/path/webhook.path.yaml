delete:
  description: Delete a webhook.
  operationId: Webhook delete
  parameters:
    - { $ref: "../param/webhook-id.param.yaml" }
  responses:
    "204":
      description: Deleted
  security:
    - Bearer: []
  summary: Delete Webhook
  tags: [Webhooks]
description: Webhook.
get:
  description: Get a webhook.
  operationId: Webhook get
  parameters:
    - { $ref: ../param/webhook-id.param.yaml }
  responses:
    "200":
      content:
        application/json:
          schema:
            properties:
              webhook: { $ref: ../schema/webhook-read.schema.yaml }
            required: [webhook]
            type: object
      description: Success
  summary: Webhook
  tags: [Webhooks]
put:
  description: Update a webhook.
  operationId: Webhook update
  parameters:
    - { $ref: ../param/webhook-id.param.yaml }
  requestBody:
    content:
      application/json:
        schema:
          properties:
            webhook: { $ref: ../schema/webhook-update.schema.yaml }
          required: [webhook]
          type: object
    required: true
  responses:
    "204":
      description: Success
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  summary: Update Webhook
  tags: [Webhooks]
summary: Webhook
