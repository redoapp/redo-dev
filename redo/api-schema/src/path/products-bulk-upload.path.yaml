post:
  description: |
    Bulk create or update product families and their variants.

    Submit up to 1,000 product families per request, each containing up to 100 variants.
    Products are processed asynchronously in batches. Only one bulk upload can run per store at a time.

    ## Matching Strategy

    The API uses the following priority to match incoming product families to existing records:

    1. **`product_family_id`** — Redo product family ID (direct lookup)
    2. **`external_id`** — ID from your external system
    3. **SKU** — Matched via variant SKUs

    If no match is found, a new product family is created.

    ## Concurrency

    Only one bulk upload operation can run per store at a time. If a bulk upload is already
    in progress, the request will return a `409 Conflict` error.
  operationId: Products bulk upload
  parameters:
    - $ref: "../param/store-id.param.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schema/bulk-product-upload-request.schema.yaml"
        examples:
          single_product:
            summary: Single product with one variant
            value:
              products:
                - title: "Classic T-Shirt"
                  description: "A comfortable cotton t-shirt"
                  vendor: "Acme Apparel"
                  tags: ["apparel", "basics"]
                  kind: "SELLABLE"
                  variants:
                    - sku: "TSHIRT-BLK-M"
                      price: 2999
                      currency: "USD"
                      weight: 200
                      weight_unit: "g"
          multiple_products_with_options:
            summary: Multiple products with options and images
            value:
              products:
                - title: "Running Shoes"
                  external_id: "EXT-SHOES-001"
                  options:
                    - name: "Size"
                      values: ["9", "10", "11"]
                    - name: "Color"
                      values: ["Black", "White"]
                  images:
                    - url: "https://example.com/shoes-main.jpg"
                      alt_text: "Running shoes front view"
                  variants:
                    - sku: "SHOE-BLK-9"
                      price: 12999
                      currency: "USD"
                      option_values: ["9", "Black"]
                    - sku: "SHOE-WHT-10"
                      price: 12999
                      currency: "USD"
                      option_values: ["10", "White"]
                - title: "Athletic Socks"
                  variants:
                    - sku: "SOCK-WHT-L"
                      price: 1499
                      currency: "USD"
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../schema/bulk-product-upload-response.schema.yaml"
          examples:
            success:
              summary: Successful upload
              value:
                total_count: 2
                processed_count: 2
                error_count: 0
                results:
                  - status: "created"
                    product_family_id: "01H5K3EXAMPLE1"
                    products:
                      - id: "01H5K3EXAMPLE1A"
                        sku: "SHOE-BLK-9"
                      - id: "01H5K3EXAMPLE1B"
                        sku: "SHOE-WHT-10"
                  - status: "updated"
                    product_family_id: "01H5K3EXAMPLE2"
                    products:
                      - id: "01H5K3EXAMPLE2A"
                        sku: "SOCK-WHT-L"
            partial_failure:
              summary: Partial failure
              value:
                total_count: 2
                processed_count: 1
                error_count: 1
                results:
                  - status: "created"
                    product_family_id: "01H5K3EXAMPLE3"
                    products:
                      - id: "01H5K3EXAMPLE3A"
                        sku: "TSHIRT-BLK-M"
                  - status: "error"
                    error: "Duplicate SKU found in request"
      description: Upload completed
    "400":
      content:
        application/json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Invalid request body or missing required fields
    "409":
      content:
        application/json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: A bulk upload is already in progress for this store
    default:
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Error
  security:
    - Bearer: []
  summary: Bulk upload products (Beta)
  tags:
    - Products
