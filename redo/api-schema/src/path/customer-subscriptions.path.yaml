description:
  Update customer subscription preferences for marketing and transactional
  messages.
post:
  description:
    Update customer subscription status for SMS and email marketing and
    transactional messages. If the customer with that phone number or email does
    not exist, it will be created.
  operationId: Customer subscriptions update
  parameters:
    - $ref: ../param/store-id.param.yaml
  requestBody:
    content:
      application/json:
        schema:
          properties:
            email:
              $ref: ../schema/customer-subscription-email.schema.yaml
            sms:
              $ref: ../schema/customer-subscription-sms.schema.yaml
          type: object
        examples:
          full_example:
            summary: All channels and subscription types
            value:
              sms:
                phoneNumber: "+15550000000"
                subscriptions:
                  marketing:
                    subscriptionStatus: subscribed
                    triggerAutomations: true
                    updatedAt: "2026-01-15T10:30:00Z"
                  transactional:
                    subscriptionStatus: subscribed
                    updatedAt: "2026-01-15T10:30:00Z"
              email:
                email: "jane.doe@example.com"
                subscriptions:
                  marketing:
                    subscriptionStatus: subscribed
                    triggerAutomations: true
                    updatedAt: "2026-01-15T10:30:00Z"
          sms_only:
            summary: SMS marketing and transactional
            value:
              sms:
                phoneNumber: "+15550000000"
                subscriptions:
                  marketing:
                    subscriptionStatus: subscribed
                  transactional:
                    subscriptionStatus: subscribed
          email_only:
            summary: Email marketing only
            value:
              email:
                email: "jane.doe@example.com"
                subscriptions:
                  marketing:
                    subscriptionStatus: unsubscribed
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: ../schema/customer-subscription-update-response.schema.yaml
          examples:
            full_example:
              summary: All channels updated
              value:
                success: true
                message: "Customer subscriptions updated successfully"
                updatedSubscriptions:
                  sms:
                    marketing: true
                    transactional: true
                  email:
                    marketing: true
            sms_only:
              summary: SMS only updated
              value:
                success: true
                message: "Customer subscriptions updated successfully"
                updatedSubscriptions:
                  sms:
                    marketing: true
      description: Success
    "400":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Bad Request
    "500":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Internal Server Error
    default:
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Error
  security:
    - Bearer: []
  summary: Update Customer Subscriptions
  tags:
    - Customer Subscriptions
summary: Customer subscriptions
