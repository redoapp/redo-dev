description:
  Update customer subscription preferences for marketing and transactional
  messages.
post:
  description:
    Update customer subscription status for SMS and email marketing and
    transactional messages. If the customer with that phone number or email does
    not exist, it will be created.
  operationId: Customer subscriptions update
  parameters:
    - $ref: ../param/store-id.param.yaml
  requestBody:
    content:
      application/json:
        schema:
          properties:
            email:
              $ref: ../schema/customer-subscription-email.schema.yaml
            sms:
              $ref: ../schema/customer-subscription-sms.schema.yaml
          type: object
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: ../schema/customer-subscription-update-response.schema.yaml
      description: Success
    "400":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Bad Request
    "500":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Internal Server Error
    default:
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Error
  security:
    - Bearer: []
  summary: Update customer subscriptions
  tags:
    - Customer subscriptions
summary: Customer subscriptions
