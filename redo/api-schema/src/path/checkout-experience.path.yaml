delete:
  description: |
    Permanently delete a checkout experience and its shipping methods.

    An experience that is live in the store's checkout tree cannot be deleted:
    route the checkout tree away from it first. Deleting it would leave checkout
    pointing at an experience that no longer exists.

    Requires the [`checkout_write`](/docs/api-reference/scopes) scope.
  operationId: Checkout experience delete
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: ../schema/checkout-experience-write-response.schema.yaml
      description: Deleted
    "404":
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: >-
        No checkout experience with this ID exists for the store. Returned with
        type `com.getredo.api:checkout/not-found`.
    "409":
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: >-
        The experience is live in the checkout tree. Returned with type
        `com.getredo.api:checkout/live-experience`.
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: Delete checkout experience
  tags: [Checkout Experiences]
description: Checkout experience.
get:
  description: |
    Get a checkout experience with the full configuration of each shipping
    method: prices and the cart conditions they apply to, carrier services,
    markups, price constraints, and fulfillment delays.

    ## Fulfillment delay

    `fulfillmentDelayDaysOverride` is the number of days Redo assumes an order
    takes to leave the warehouse when it estimates delivery dates. It can be set
    on the experience, and on individual dynamic shipping methods, where it
    overrides the experience's value. When neither is set, the store-level value
    applies.

    Requires the [`checkout_read`](/docs/api-reference/scopes) scope.
  operationId: Checkout experience get
  responses:
    "200":
      content:
        application/json:
          schema:
            properties:
              checkoutExperience:
                $ref: ../schema/checkout-experience.schema.yaml
            required: [checkoutExperience]
            type: object
          examples:
            experience:
              summary: An experience with a flat rate and a live carrier rate
              value:
                checkoutExperience:
                  id: 66b2f1c9e4b0a1d2c3f4a5b6
                  name: Standard rates
                  active: true
                  createdAt: "2026-08-12T15:04:05.000Z"
                  fulfillmentDelayDaysOverride: 2
                  methods:
                    - id: 66b2f1c9e4b0a1d2c3f4a5c7
                      name: Standard
                      description: 5-8 business days
                      type: fixed
                      priceDisplay: $5.99
                      rates:
                        - price: "5.99"
                          currency: USD
                          conditions: []
                          enabled: true
                    - id: 66b2f1c9e4b0a1d2c3f4a5c8
                      name: Ground
                      description: Quoted live
                      type: dynamic
                      priceDisplay: DYNAMIC
                      fulfillmentDelayDaysOverride: 3
                      carrierServices:
                        - carrier: FedEx
                          service: FEDEX_GROUND
                          enabled: true
      description: Success
    "404":
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: >-
        No checkout experience with this ID exists for the store. Returned with
        type `com.getredo.api:checkout/not-found`.
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: Get checkout experience
  tags: [Checkout Experiences]
parameters:
  - { $ref: ../param/store-id.param.yaml }
  - { $ref: ../param/checkout-experience-id.param.yaml }
patch:
  description: |
    Change a checkout experience's settings. Only the fields you send are
    changed.

    Set `fulfillmentDelayDaysOverride` to change how many days of fulfillment
    delay delivery estimates assume across the experience, or send `null` to
    remove the override so the store-level value applies again.

    Changes to an experience that is live in the checkout tree take effect for
    shoppers immediately.

    Requires the [`checkout_write`](/docs/api-reference/scopes) scope.
  operationId: Checkout experience update
  requestBody:
    content:
      application/json:
        schema: { $ref: ../schema/checkout-experience-update-request.schema.yaml }
        examples:
          set_delay:
            summary: Assume two days of fulfillment delay
            value:
              fulfillmentDelayDaysOverride: 2
          clear_delay:
            summary: Fall back to the store-level delay
            value:
              fulfillmentDelayDaysOverride: null
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: ../schema/checkout-experience-write-response.schema.yaml
      description: Updated
    "400":
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: >-
        Invalid request body, a blank name, a fulfillment delay that is not a
        whole number of days zero or more, or landed costs enabled over an
        incompatible shipping method. Returned with type
        `com.getredo.api:checkout/invalid-request`.
    "404":
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: >-
        No checkout experience with this ID exists for the store. Returned with
        type `com.getredo.api:checkout/not-found`.
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: Update checkout experience
  tags: [Checkout Experiences]
summary: Checkout Experience
