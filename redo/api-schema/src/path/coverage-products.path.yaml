description: Available coverage products.
post:
  description: Get available coverage products. This endpoint exposes public storefront coverage data and does not require an access scope.
  operationId: Coverage products
  parameters:
    - { $ref: ../param/store-id.param.yaml }
  requestBody:
    content:
      application/json:
        schema:
          properties:
            cart: { $ref: ../schema/storefront-cart.schema.yaml }
            customer: { $ref: ../schema/storefront-customer.schema.yaml }
            products:
              description: Product information.
              items:
                properties:
                  id:
                    description: Identifier of the product.
                    title: ID
                    type: string
                required: [id]
                type: object
              deprecated: true
              title: Products
              type: array
            variants:
              description: Variant information.
              items:
                properties:
                  height:
                    $ref: ../schema/length.schema.yaml
                    description: Height of an item.
                    title: Height
                  id:
                    description: Identifier of the variant.
                    title: ID
                    type: string
                  length:
                    $ref: ../schema/length.schema.yaml
                    description: Length of an item.
                    title: Length
                  title:
                    title: Title
                    type: string
                  weight:
                    $ref: ../schema/weight.schema.yaml
                    description: Weight of an item.
                    title: Weight
                  width:
                    $ref: ../schema/length.schema.yaml
                    description: Width of an item.
                    title: Width
                required: [id]
                type: object
              deprecated: true
              title: Variants
              type: array
          required: [cart]
          type: object
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            properties:
              coverageProducts:
                description: Coverage products.
                items: { $ref: ../schema/coverage-product.schema.yaml }
                title: Coverage Products
                type: array
            required: [coverageProducts]
            type: object
      description: Success
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  summary: Coverage Products
  tags: [Coverage Products]
summary: Coverage products
