description: Process return.
parameters:
  - { $ref: ../param/return-id.param.yaml }
post:
  description: |
    **BETA**: This endpoint is in beta and subject to change.

    Trigger processing of a return with specified products.
  operationId: Return process
  requestBody:
    content:
      application/json:
        schema:
          properties:
            customerNotes:
              description:
                Notes to send to customer. These can be rejection notes or
                processing notes.
              type: string
            markAsReviewed:
              description:
                Whether to mark the return as reviewed before processing
              type: boolean
            products:
              description:
                Array of products to process with their processing or rejection
                details
              items:
                properties:
                  _id:
                    description: Product ID
                    example: "64e4d5e837572a4813b73e41"
                    type: string
                  processInput:
                    nullable: true
                    properties:
                      newMerchantAdjustment:
                        description:
                          Adjustment amount. This will be the amount that is
                          credited to the customer.
                        nullable: true
                        type: number
                      restock:
                        description: Whether to restock the item
                        type: boolean
                    type: object
                required:
                  - _id
                type: object
              type: array
          required:
            - products
          type: object
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            properties:
              message:
                description: Status message
                examples:
                  - "Processing triggered successfully"
                  - "Successfully prepared some products to be processed"
                type: string
            type: object
      description: Processing request completed
    "400":
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Bad request (e.g., missing products array)
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: Process return
  tags: [Returns]
summary: Process return
