description: Create or update a customer.
post:
  description:
    Create or update a customer. Finds existing customer by email or phone
    number. If no customer is found, a new one is created. Supports setting
    core profile fields and custom fields.
  operationId: Customer create or update
  parameters:
    - $ref: ../param/store-id.param.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../schema/customer-create-or-update-request.schema.yaml
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: ../schema/customer-response.schema.yaml
      description: Customer updated
    "201":
      content:
        application/json:
          schema:
            $ref: ../schema/customer-response.schema.yaml
      description: Customer created
    "400":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Bad Request
    "500":
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Internal Server Error
    default:
      content:
        application/problem+json:
          schema:
            $ref: ../schema/error.schema.yaml
      description: Error
  security:
    - Bearer: []
  summary: Create or Update Customer
  tags:
    - Customers
summary: Create or update customer
