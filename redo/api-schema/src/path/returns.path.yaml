description: List of returns for store.
get:
  description: List returns, sorted by most recent to least recent. Requires the [`returns_read`](/docs/api-reference/scopes) scope.
  operationId: Returns list
  parameters:
    - { $ref: ../param/page-continue.param.yaml }
    - { $ref: ../param/page-size.param.yaml }
    - { $ref: ../param/updated-at-max.param.yaml }
    - { $ref: ../param/updated-at-min.param.yaml }
    - { $ref: ../param/shopify-order-name.yaml }
    - { $ref: ../param/provider-order-name.yaml }
    - { $ref: ../param/return-status.param.yaml }
  responses:
    "200":
      content:
        application/json:
          schema:
            properties:
              orders:
                items: { $ref: ../schema/order-read.schema.yaml }
                type: array
              returns:
                items: { $ref: ../schema/return-read.schema.yaml }
                type: array
            required: [orders, returns]
            type: object
      description: Success
      headers:
        X-Page-Next: { $ref: ../header/page-next.header.yaml }
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: List Returns
  tags: [Returns]
post:
  description: Create a return for specific order line items. Requires the [`returns_write`](/docs/api-reference/scopes) scope.
  operationId: Return create
  parameters:
    - { $ref: ../param/idempotency-key.param.yaml }
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../schema/create-return-request.schema.yaml
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: ../schema/create-return-response.schema.yaml
      description: Success (idempotent replay; existing return returned)
    "201":
      content:
        application/json:
          schema:
            $ref: ../schema/create-return-response.schema.yaml
      description: Created
    "400":
      content:
        application/json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Invalid request body
    "404":
      content:
        application/json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Order not found
    "409":
      content:
        application/json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Conflict
    default:
      content:
        application/problem+json:
          schema: { $ref: ../schema/error.schema.yaml }
      description: Error
  security:
    - Bearer: []
  summary: Create Return
  tags: [Returns]
parameters:
  - { $ref: ../param/store-id.param.yaml }
summary: Returns
