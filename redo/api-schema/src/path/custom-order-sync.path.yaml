post:
  description: |
    Sync an order to Redo so your shoppers can return it.

    This is the returns integration path for commerce platforms Redo does not
    support directly. Orders pushed here become returnable: the shopper can look
    up the order in the return portal, and Redo uses the line items, discounts,
    and taxes you send to decide what is eligible for return and what to refund.

    Syncing the same order ID again updates the existing Redo order, so this is
    safe to call on every order create and update.

    For a walkthrough of the full integration, including field-by-field mapping
    and a complete example payload, see the
    [Custom Returns Integration guide](/docs/guides/integrations/custom-returns-integration).

    Important: If Redo coverage is attached to this order, include a single
    coverage line item with:
    - vendor: "re:do"
    - sku: "x-redo"
    - priceSet: the full amount the shopper paid for coverage
    - properties: _redo_type with value "returns", "package protection",
      "both", or "final sale" (comma-separate to combine, e.g.
      "returns,package protection")
    - tags: the same values, read only when _redo_type is absent

    Matching ignores case, and treats spaces, underscores, and hyphens as
    equivalent, so "Package_Protection" and "package protection" are the same
    value. A value Redo does not recognize is treated as returns coverage.
  operationId: Custom Order Sync
  parameters:
    - $ref: "../param/store-id.param.yaml"
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schema/custom-order/custom-order-sync.schema.yaml"
    required: true
  responses:
    "200":
      description: Order synced successfully
      content:
        application/json:
          schema:
            $ref: "../schema/custom-order/custom-order-sync-response.schema.yaml"
    "400":
      content:
        application/json:
          schema:
            $ref: "../schema/custom-order/custom-order-error.schema.yaml"
      description:
        Invalid order data. `errors` contains the field-level validation
        details.
    "401":
      content:
        application/json:
          schema:
            $ref: "../schema/custom-order/custom-order-error.schema.yaml"
      description: Missing or invalid API token
    "403":
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Token does not have access to this store
    "404":
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Store does not exist
    "500":
      content:
        application/json:
          schema:
            $ref: "../schema/custom-order/custom-order-error.schema.yaml"
      description: Failed to process order
    default:
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Error
  security:
    - Bearer: []
  summary: Sync Custom Order
  tags:
    - Returns Custom Integration
