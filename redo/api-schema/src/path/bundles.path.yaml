get:
  description: |
    List the bundles stored for a store. Each product is looked up in your
    catalog, so you get SKUs and names rather than bare identifiers.

    ## Finding one bundle

    Pass `parent_sku` to return just that bundle. The lookup goes through your
    catalog, so a bundle created in the Redo UI is found too. `sku_resolved`
    tells you whether the SKU exists at all, as opposed to existing but having
    no bundle. If the SKU is on more than one variant, you get every matching
    bundle; use `parent.variant_id` to tell them apart. Filtered requests are
    not paged.

    ## Quantities

    Each child carries `quantity`, the number of units of that product in the
    bundle. This mirrors what you send on `PUT`.

    ## Products that no longer exist

    A product can be deleted after a bundle is built. When that happens the
    entry has `resolved: false` and `sku` and `name` are `null`. A resolved
    product with a `null` `sku` simply has no SKU set; such a bundle can only be
    managed from the Bundles page in Redo.

    ## Paging

    `X-Page-Size` sets the page size, up to 250 (default 50). When more bundles
    remain, the response includes an `X-Page-Next` header; send it back as
    `X-Page-Continue` for the next page. Treat the cursor as opaque.

    Requires the [`returns_read`](/docs/api-reference/scopes) scope.
  operationId: Bundles list
  parameters:
    - { $ref: "../param/bundle-page-continue.param.yaml" }
    - { $ref: "../param/bundle-page-size.param.yaml" }
    - { $ref: "../param/bundle-parent-sku.param.yaml" }
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../schema/bundle-list-response.schema.yaml"
          examples:
            page:
              summary: A page of bundles
              value:
                bundles:
                  - parent:
                      variant_id: "55518673568035"
                      sku: BUNDLE-STARTER-KIT
                      name: Starter Kit
                      resolved: true
                    children:
                      - variant_id: "55518673404195"
                        sku: SOCKS-BLK-L
                        name: Socks - Black / L
                        returnable: true
                        quantity: 1
                        resolved: true
                      - variant_id: "55518673600803"
                        sku: TSHIRT-BLK-M
                        name: T-Shirt - Black / M
                        returnable: true
                        quantity: 2
                        resolved: true
                    return_types: [return, warranty]
            dangling_reference:
              summary: A bundle pointing at a deleted product
              value:
                bundles:
                  - parent:
                      variant_id: "55518673568035"
                      sku: BUNDLE-STARTER-KIT
                      name: Starter Kit
                      resolved: true
                    children:
                      - variant_id: "55518673404195"
                        sku: SOCKS-BLK-L
                        name: Socks - Black / L
                        returnable: true
                        quantity: 1
                        resolved: true
                      - variant_id: "40668437479506"
                        sku: null
                        name: null
                        returnable: true
                        quantity: 1
                        resolved: false
                    return_types: [claim, return, warranty, recycle, withdrawal]
            sku_not_found:
              summary: parent_sku matched no product in the catalog
              value:
                bundles: []
                sku_resolved: false
      description: Success
      headers:
        X-Page-Next: { $ref: "../header/page-next.header.yaml" }
    "400":
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description:
        Invalid `X-Page-Size`, or a malformed `X-Page-Continue` cursor
    "500":
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: The bundle lookup did not complete
    default:
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Error
  security:
    - Bearer: []
  summary: List bundles
  tags:
    - Bundles
put:
  description: |
    Add or replace bundles, identified by parent SKU.

    A bundle groups several products under one product that shoppers buy. When
    a bundle is returned, Redo uses this definition to break it back into the
    products it contains.

    Send the same payload whether a bundle is new or already exists. A bundle
    whose parent SKU is already stored is replaced; bundles you do not send are
    left alone. To remove a bundle, call
    `DELETE /stores/{storeId}/bundles/{parentSku}`.

    ## If your store reuses SKUs

    Your store does not require SKUs to be unique. If the same SKU can be on
    more than one variant, always send `parent_variant_id` and
    `children_skus[].variant_id` so Redo knows which variant you mean. Without
    them, a bundle containing a shared SKU is not stored and its result is
    `ambiguous`, listing the `variant_ids` to choose from. Stores with unique
    SKUs can leave these fields out.

    ## Quantities

    `quantity` is how many units of a child the bundle contains, and it affects
    how a refund is split across the bundle. Maximum 100 per child. Listing the
    same child twice adds the quantities together.

    ## Return types

    `return_types` limits the bundle to specific return types. Omit it to apply
    the bundle to all of them. It replaces whatever was previously set, so
    include it on every request if you rely on it.

    ## Reading the response

    A `200` means the request was processed, not that every bundle was stored.
    Check each entry in `results`:

    - `applied` — stored as requested.
    - `failed` — a SKU matched no product. `unresolved_skus` names each one.
      Common causes are a typo, a deleted product, or a variant with no SKU
      set.
    - `ambiguous` — a SKU is on more than one variant and no variant was given.
      See above.

    A single bad child is enough to skip the whole bundle. SKUs are matched
    exactly and are case-sensitive.

    ## Limits

    Send at most 100 bundles per request; split larger sets into batches.
    Entries that share a `parent_sku` are merged into one bundle. Only one
    upload can run per store at a time, shared with the CSV upload in Redo; a
    request that arrives during another returns `409` and can be retried.

    Requires the [`returns_write`](/docs/api-reference/scopes) scope.
  operationId: Bundles upsert
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schema/bundle-upsert-request.schema.yaml"
        examples:
          single_bundle:
            summary: One bundle containing two products
            value:
              - parent_sku: BUNDLE-STARTER-KIT
                children_skus:
                  - sku: SOCKS-BLK-L
                    quantity: 1
                  - sku: TSHIRT-BLK-M
                    quantity: 2
          restricted_return_types:
            summary: A bundle that only applies to returns and warranties
            value:
              - parent_sku: BUNDLE-BEDDING
                children_skus:
                  - sku: SHEET-QUEEN-WHT
                    quantity: 1
                  - sku: PILLOWCASE-WHT
                    quantity: 2
                return_types: [return, warranty]
          shared_sku:
            summary: Choosing a variant after an ambiguous result
            value:
              - parent_sku: BUNDLE-STARTER-KIT
                parent_variant_id: "55518673568035"
                children_skus:
                  - sku: SOCKS-BLK-L
                    quantity: 1
                  - sku: TSHIRT-BLK-M
                    quantity: 2
                    variant_id: "55518673600803"
          multiple_bundles:
            summary: Several bundles in one request
            value:
              - parent_sku: BUNDLE-STARTER-KIT
                children_skus:
                  - sku: SOCKS-BLK-L
                    quantity: 1
                  - sku: TSHIRT-BLK-M
                    quantity: 1
              - parent_sku: BUNDLE-DELUXE-KIT
                children_skus:
                  - sku: SOCKS-BLK-L
                    quantity: 1
                  - sku: TSHIRT-BLK-M
                    quantity: 4
    required: true
  responses:
    "200":
      content:
        application/json:
          schema:
            $ref: "../schema/bundle-upsert-response.schema.yaml"
          examples:
            all_applied:
              summary: Every bundle stored
              value:
                total_count: 2
                applied_count: 2
                failed_count: 0
                ambiguous_count: 0
                results:
                  - parent_sku: BUNDLE-STARTER-KIT
                    status: applied
                  - parent_sku: BUNDLE-DELUXE-KIT
                    status: applied
            partial_failure:
              summary: One bundle skipped because a SKU was not found
              value:
                total_count: 2
                applied_count: 1
                failed_count: 1
                ambiguous_count: 0
                results:
                  - parent_sku: BUNDLE-STARTER-KIT
                    status: applied
                  - parent_sku: BUNDLE-DELUXE-KIT
                    status: failed
                    unresolved_skus: [TSHIRT-BLK-XL]
            ambiguous:
              summary: A SKU is on more than one variant
              value:
                total_count: 1
                applied_count: 0
                failed_count: 0
                ambiguous_count: 1
                results:
                  - parent_sku: BUNDLE-STARTER-KIT
                    status: ambiguous
                    ambiguous_skus:
                      - sku: TSHIRT-BLK-M
                        variant_ids: ["55518673600803", "55518673633571"]
      description:
        Request processed. Check `results` to see which bundles were stored.
    "400":
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description:
        Invalid request body, an unrecognized return type, a blank SKU, a
        quantity above 100, or more than 100 bundles
    "409":
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: A bundle upload is already in progress for this store
    default:
      content:
        application/problem+json:
          schema:
            $ref: "../schema/error.schema.yaml"
      description: Error
  security:
    - Bearer: []
  summary: Add or replace bundles
  tags:
    - Bundles
parameters:
  - { $ref: ../param/store-id.param.yaml }
summary: Bundles
